name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Кэширование зависимостей для ускорения

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Добавляем линтер и тестовые зависимости, если их нет в requirements.txt
          pip install ruff pytest httpx

      - name: Lint with Ruff
        run: |
          ruff check app/

      - name: Run tests with pytest
        run: |
          # Если тестов пока нет, эта команда может упасть. 
          # Можно временно добавить '|| true', но лучше написать хотя бы один тест.
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t digital-twin-api:ci .