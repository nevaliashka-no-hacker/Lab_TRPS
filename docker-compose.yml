services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-twin-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/digital_twin.db
    volumes:
      # Монтируем код для hot-reload при разработке
      - ./app:/app/app:ro
      # Персистентное хранилище для SQLite
      - twin_data:/app/data
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  twin_data: